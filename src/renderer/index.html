<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; font-src 'self'; img-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stark File Manager</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="mast">
        <div class="brand">
          <span class="mark" aria-hidden="true"></span>
          <div>
            <p class="kicker">Col 12</p>
            <h1>Stark</h1>
          </div>
        </div>
        <nav id="crumb" class="crumb-row" aria-label="Current path"></nav>
        <div class="mast-side">
          <p id="status" class="status"></p>
          <div class="actions">
            <button id="up" type="button" title="Backspace">Up</button>
            <button id="refresh" type="button" title="F5">Refresh</button>
            <button id="explorer" type="button">Explorer</button>
          </div>
        </div>
      </header>

      <div id="banner" class="banner" role="alert" hidden></div>

      <main class="stage">
        <section class="band col-4" aria-labelledby="dir-label">
          <header class="band-label" id="dir-label">
            <span class="band-copy">
              <strong>File directory</strong>
              <small id="dir-meta">col-4</small>
            </span>
          </header>
          <div class="list" id="directory">
            <p class="pending-copy">Reading this computer…</p>
          </div>
        </section>

        <section class="band col-6" aria-labelledby="inside-label">
          <header class="band-label" id="inside-label">
            <span class="band-copy">
              <strong>Folders inside</strong>
              <small id="inside-meta">col-6 · largest to smallest</small>
            </span>
          </header>
          <div class="list" id="inside"></div>
        </section>

        <section class="band col-2" aria-labelledby="desktop-label">
          <header class="band-label" id="desktop-label">
            <span class="band-copy">
              <strong>Desktop folders</strong>
              <small id="desktop-meta">col-2</small>
            </span>
          </header>
          <div class="list" id="desktop"></div>
        </section>
      </main>
    </div>
    <script src="app.js"></script>
  </body>
</html>
